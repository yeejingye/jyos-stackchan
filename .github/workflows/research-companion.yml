name: Research companion checks

on:
  push:
    branches: [jyos-stackchan, codex/research-status, codex/on-device-completion]
    paths: ["firmware/**", ".github/workflows/research-companion.yml"]
  pull_request:
    branches: [jyos-stackchan, codex/research-status]
    paths: ["firmware/**", ".github/workflows/research-companion.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install-moddable: "false"
      - name: Firmware unit tests
        run: npm run test:unit
      - name: Companion integration tests
        run: npm run test:research
      - name: Firmware architecture checks
        run: npm run check:architecture
      - name: Companion style checks
        run: npm exec -- biome ci mods/research_companion tools/research-companion
